<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Finanze"/>
  <meta name="theme-color" content="#0D9488"/>
  <title>Finanze</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>






















    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;background:#EEF2F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
    #root{max-width:430px;margin:0 auto;min-height:100%;}
    #splash{position:fixed;inset:0;background:linear-gradient(135deg,#0D9488 0%,#0EA5E9 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.4s ease;}
    #splash.out{opacity:0;pointer-events:none;}
    .sp-box{width:88px;height:88px;border-radius:28px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 8px 32px rgba(0,0,0,0.15);}
    .sp-title{font-size:28px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
    .sp-sub{font-size:13px;color:rgba(255,255,255,0.65);margin-top:6px;}
    .sp-bar{width:48px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:32px;overflow:hidden;}
    .sp-fill{height:100%;background:#fff;border-radius:2px;animation:ld 1.4s ease-in-out infinite;}
    @keyframes ld{0%{width:0;margin-left:0}50%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
    /* Prevent iOS zoom on input focus */
    input,select,textarea{font-size:16px !important;}
    * {touch-action:manipulation;}
    /* Spazio fisso in cima: status bar + un po di respiro */
    #root {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header fisso in cima a ogni pagina */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #EEF2F7;
      padding-top: calc(env(safe-area-inset-top) + 12px);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 10px;
      margin-bottom: 0;
    }

    /* Hero card: inizia dopo la status bar */
    .hero {
      margin-top: calc(env(safe-area-inset-top) + 8px) !important;
      padding-top: 22px !important;
    }

    /* Tab bar: rispetta home indicator */
    nav {
      padding-bottom: max(18px, env(safe-area-inset-bottom)) !important;
    }

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  </style>
